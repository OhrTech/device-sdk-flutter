name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: The generated messages match pigeons/messages.dart
        run: |
          dart run pigeon --input pigeons/messages.dart
          git diff --exit-code -- lib/src/messages.g.dart android/src/main/kotlin/net/ohrtech/device/flutter/Messages.g.kt

      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --dry-run

      - name: The example app builds
        working-directory: example
        run: flutter build apk --debug
