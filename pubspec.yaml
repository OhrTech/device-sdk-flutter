name: ohrtech_device
description: >-
  The OhrTech Device SDK for Flutter: what an app on an OhrTech device can ask the OhrTech Agent for.
  The device, its updates, Wi-Fi with Android's Wi-Fi screen in your layout, network, kiosk mode, power,
  settings, managed configuration, attestation, client certificates, USB devices, diagnostics, TEE keys
  and end-to-end push.
version: 0.1.1
homepage: https://docs.ohrtech.net/device-sdk/
repository: https://github.com/OhrTech/device-sdk-flutter
issue_tracker: https://github.com/OhrTech/device-sdk-flutter/issues
topics: [mdm, kiosk, device-management, android, wifi]

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.1.1

flutter:
  plugin:
    platforms:
      android:
        package: net.ohrtech.device.flutter
        pluginClass: OhrDevicePlugin
